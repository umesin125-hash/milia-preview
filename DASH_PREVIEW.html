const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),status=document.getElementById('status');ctx.imageSmoothingEnabled=false;
const GROUND=440,BASE=220,DASH_SPEED=BASE*1.7,MAX_DASH=.7,DOUBLE_WINDOW=.26;
const input={left:false,right:false,dash:false,jump:false};let lastDirection=0,lastTapAt=-10,prevDir=0,padPresent=false,prevPadDir=0;
const player={x:190,y:GROUND,vy:0,onGround:true,dir:1,dashing:false,dashElapsed:0,dashDir:1,dashLocked:false,dashSource:'button',ghosts:[],dust:[],emit:0};
const nowSec=()=>performance.now()/1000;
function downDirection(dir){const t=nowSec(); if(dir===lastDirection && t-lastTapAt<DOUBLE_WINDOW) tryDash(dir,'double'); lastDirection=dir;lastTapAt=t;}
function tryDash(dir,source='button'){if(!player.onGround||player.dashing||player.dashLocked||dir===0)return;player.dashing=true;player.dashSource=source;player.dashElapsed=0;player.dashDir=dir;player.dir=dir;player.emit=0;for(let i=0;i<15;i++)player.dust.push({x:player.x+(Math.random()-.5)*15,y:GROUND-6, vx:-dir*(35+Math.random()*105),vy:-(40+Math.random()*55),life:.35+Math.random()*.24,max:.59});}
function setDirInput(direction,val){if(direction<0){if(val&&!input.left)downDirection(-1);input.left=val;} else {if(val&&!input.right)downDirection(1);input.right=val;}}
for(const [id,key] of [['left','left'],['right','right'],['dash','dash'],['jump','jump']]){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);if(key==='left'||key==='right')setDirInput(key==='left'?-1:1,true);else input[key]=true;}); for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,e=>{e.preventDefault();if(key==='left'||key==='right')setDirInput(key==='left'?-1:1,false);else input[key]=false;});}
const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ShiftLeft:'dash',ShiftRight:'dash',Space:'jump'};
window.addEventListener('keydown',e=>{let k=keyMap[e.code];if(!k)return;e.preventDefault();if(e.repeat)return;if(k==='left'||k==='right')setDirInput(k==='left'?-1:1,true);else input[k]=true;});window.addEventListener('keyup',e=>{let k=keyMap[e.code];if(!k)return;e.preventDefault();if(k==='left'||k==='right')setDirInput(k==='left'?-1:1,false);else input[k]=false;});
function padPoll(){const pads=navigator.getGamepads?.()||[];const p=Array.from(pads).find(q=>q&&q.connected);padPresent=!!p;if(!p){prevPadDir=0;return {dir:0,dash:false,jump:false};}const b=i=>!!p.buttons[i]?.pressed;let dir=(b(15)||p.axes[0]>.4?1:0)-(b(14)||p.axes[0]<-.4?1:0);if(dir && dir!==prevPadDir)downDirection(dir);prevPadDir=dir;return {dir,dash:b(1),jump:b(0)};}
let last=performance.now(),prevJump=false,prevDashPressed=false;
function update(dt){const pad=padPoll();const dir=pad.dir||((input.right?1:0)-(input.left?1:0));const dashHeld=input.dash||pad.dash;const jumpHeld=input.jump||pad.jump;
if(dir)player.dir=dir;
if(jumpHeld&&!prevJump&&player.onGround&&!player.dashing){player.vy=-550;player.onGround=false;}prevJump=jumpHeld;
if(dashHeld&&!prevDashPressed&&dir) tryDash(dir);if(dashHeld&&dir&&!player.dashLocked&&!player.dashing) tryDash(dir);prevDashPressed=dashHeld;
if(player.dashing){player.dashElapsed+=dt; player.x+=player.dashDir*DASH_SPEED*dt;player.emit-=dt;if(player.emit<=0){player.ghosts.push({x:player.x,y:player.y,dir:player.dashDir,life:.26,max:.26});player.emit=.038;}if(player.dashElapsed>=MAX_DASH||!player.onGround||(player.dashSource==='button'&&!dashHeld)||(player.dashSource==='double'&&dir!==player.dashDir)){player.dashing=false;player.dashLocked=true;}}
else if(dir){player.x+=dir*BASE*dt;}
if(!dashHeld && dir===0) player.dashLocked=false;
if(!player.onGround){player.vy+=1250*dt;player.y+=player.vy*dt;if(player.y>=GROUND){player.y=GROUND;player.vy=0;player.onGround=true;}}
player.x=Math.max(55,Math.min(910,player.x));
for(const g of player.ghosts)g.life-=dt;player.ghosts=player.ghosts.filter(g=>g.life>0);
for(const d of player.dust){d.x+=d.vx*dt;d.y+=d.vy*dt;d.vy+=240*dt;d.life-=dt;}player.dust=player.dust.filter(d=>d.life>0);
status.textContent=player.dashing?'DASH '+(MAX_DASH-player.dashElapsed).toFixed(2)+'秒':(!player.onGround?'AIR (空中ダッシュ不可)':padPresent?'DUALSHOCK / Gamepad 認識中':'タッチ／キーボード操作');}
function render(t){ctx.clearRect(0,0,960,540);const sky=ctx.createLinearGradient(0,0,0,540);sky.addColorStop(0,'#0a152f');sky.addColorStop(1,'#244664');ctx.fillStyle=sky;ctx.fillRect(0,0,960,540);
for(let i=0;i<45;i++){ctx.fillStyle=i%3?'#365978':'#5a86a2';ctx.fillRect((i*97)%960,80+(i*43)%300,3+(i%4)*2,2+(i%3)*2);}
ctx.fillStyle='#347850';ctx.fillRect(0,GROUND,960,18);ctx.fillStyle='#28472c';ctx.fillRect(0,GROUND+18,960,82);for(let i=0;i<960;i+=18){ctx.fillStyle=i%36?'#3b8b4f':'#64a95d';ctx.fillRect(i,GROUND-5,12,6);}
const frameW=384,scale=.69,sw=frameW*scale;const draw=(img,px,py,flip,alpha=1)=>{if(!img.complete||!img.naturalWidth)return;ctx.save();ctx.globalAlpha=alpha;ctx.translate(px,py);if(flip<0)ctx.scale(-1,1);ctx.drawImage(img,-190*scale,-304*scale,sw,sw);ctx.restore();};
for(const g of player.ghosts){const a=g.life/g.max;draw(ghost,g.x,g.y,g.dir,Math.pow(a,1.3)*.64);}
for(const d of player.dust){let a=Math.min(1,d.life/d.max);ctx.fillStyle='rgba(184,173,156,'+(a*.65)+')';const s=Math.max(2,6*a);ctx.fillRect(Math.round(d.x-s/2),Math.round(d.y-s/2),Math.round(s),Math.round(s));}
if(player.dashing){ctx.save();ctx.globalAlpha=.22;ctx.strokeStyle='#70a0ff';ctx.lineWidth=4;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(player.x-player.dir*(29+18*i),player.y-35-i*10);ctx.lineTo(player.x-player.dir*(74+28*i),player.y-35-i*10);ctx.stroke();}ctx.restore();}
draw(body,player.x,player.y,player.dir,1);
ctx.fillStyle='white';ctx.font='bold 18px system-ui';ctx.fillText('GROUND ONLY  ·  0.7s MAX  ·  SPEED ×1.7',20,35);}
function loop(now){const dt=Math.min(.033,(now-last)/1000||.016);last=now;update(dt);render(now/1000);requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></body></html>
