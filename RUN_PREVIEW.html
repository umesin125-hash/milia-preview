<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15253d"><title>ミリア 走行16F｜スプライト確認</title>
<style>*{box-sizing:border-box}body{background:#0b1422;color:#f0f4ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;margin:0;padding:16px;display:flex;align-items:center;flex-direction:column;min-height:100svh}h1{font-size:1.16rem;margin:10px 0}.desc{font-size:.84rem;color:#9db3d3;margin:3px 0 15px}.panel{max-width:700px;width:100%}canvas{width:100%;max-width:500px;aspect-ratio:1;display:block;margin:0 auto;background:#1a2c45;border:1px solid #314967;border-radius:12px;image-rendering:pixelated}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin:15px 0}.controls button{background:#233b60;color:white;border:1px solid #476899;border-radius:9px;padding:12px 16px;font-size:.92rem;cursor:pointer}.controls button:active{background:#4068a3}label{font-size:.91rem;display:flex;align-items:center;gap:8px}input[type=range]{width:140px}#status{font-variant-numeric:tabular-nums;font-weight:bold;color:#ffd382;text-align:center;margin:8px}.note{font-size:.78rem;color:#9db3d3;line-height:1.65}.error{color:#ff9a88}</style></head>
<body><main class="panel"><h1>ミリア・走行16F アニメーション確認</h1><p class="desc">384×384px／16列×1行／右向き走行／透明背景PNG</p><canvas id="view" width="384" height="384"></canvas><div id="status">画像を読み込み中...</div><div class="controls"><button id="play">一時停止</button><button id="prev">◀ 1コマ戻る</button><button id="next">1コマ進む ▶</button></div><div class="controls"><label>速度 <input type="range" id="fps" min="6" max="24" value="12" step="1"><b id="fpsText">12 FPS</b></label><label><input id="flip" type="checkbox"> 左向き反転</label></div><p class="note">GitHub Pagesで使う場合は、このHTML（RUN_PREVIEW.html）と milia_run_16f.png を同じフォルダにアップロードしてください。画面下の緑線は接地基準位置を示します。通常のゲーム内で移動させる処理は含まれていません。</p></main>
<script>
(()=>{'use strict';const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;const image=new Image();image.src='milia_run_16f.png';const status=document.getElementById('status'),range=document.getElementById('fps'),fpsText=document.getElementById('fpsText');let index=0,playing=true,acc=0,last=0,loaded=false;const draw=()=>{ctx.clearRect(0,0,384,384);ctx.fillStyle='#1c2c42';ctx.fillRect(0,0,384,384);ctx.strokeStyle='#587b74';ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(0,340);ctx.lineTo(384,340);ctx.stroke();ctx.setLineDash([]);if(loaded){ctx.save();if(document.getElementById('flip').checked){ctx.translate(384,0);ctx.scale(-1,1);}ctx.drawImage(image,index*384,0,384,384,0,0,384,384);ctx.restore();status.textContent=`RUN  ${String(index+1).padStart(2,'0')} / 16`;}};image.onload=()=>{if(image.width!==6144||image.height!==384){status.textContent=`サイズ不一致: ${image.width}×${image.height}`;status.classList.add('error');return;}loaded=true;draw()};image.onerror=()=>{status.textContent='画像が読み込めません。milia_run_16f.png を同じ階層に配置してください。';status.classList.add('error')};function tick(now){if(!last)last=now;const dt=Math.min(now-last,100);last=now;if(playing&&loaded){acc+=dt;const period=1000/Number(range.value);while(acc>=period){index=(index+1)%16;acc-=period;}draw()}requestAnimationFrame(tick)}document.getElementById('play').addEventListener('click',()=>{playing=!playing;document.getElementById('play').textContent=playing?'一時停止':'再生';acc=0;draw()});document.getElementById('prev').addEventListener('click',()=>{playing=false;document.getElementById('play').textContent='再生';index=(index+15)%16;draw()});document.getElementById('next').addEventListener('click',()=>{playing=false;document.getElementById('play').textContent='再生';index=(index+1)%16;draw()});range.addEventListener('input',()=>{fpsText.textContent=`${range.value} FPS`;acc=0});document.getElementById('flip').addEventListener('change',draw);requestAnimationFrame(tick)})();
</script></body></html>
