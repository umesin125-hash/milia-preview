<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ミリア ジャンプ16F確認</title><style>body{background:#171d2a;color:#fff;font-family:system-ui;text-align:center;margin:15px}canvas{background:repeating-conic-gradient(#333b4b 0% 25%,#242c3d 0% 50%) 50%/32px 32px;max-width:90vw;image-rendering:pixelated;border:1px solid #667}button{font-size:16px;padding:10px;margin:4px}input{width:180px}</style><h2>ミリア ジャンプ 16F</h2><canvas width="384" height="384" id="c"></canvas><p><button onclick="playing=!playing">▶ / ⏸</button><button onclick="frame=(frame+1)%16;draw()">次のコマ</button></p><p>FPS <input type="range" min="3" max="24" value="12" id="fps"><span id="v">12</span>　フレーム <span id="f">1</span>/16</p><script>const img=new Image();img.src='milia_jump_16f.png';const c=document.getElementById('c'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;let playing=true,frame=0,last=0;function draw(){ctx.clearRect(0,0,384,384);if(img.complete&&img.naturalWidth)ctx.drawImage(img,frame*384,0,384,384,0,0,384,384);document.getElementById('f').textContent=frame+1}function tick(t){const fps=+document.getElementById('fps').value;document.getElementById('v').textContent=fps;if(playing&&t-last>1000/fps){frame=(frame+1)%16;last=t;draw()}requestAnimationFrame(tick)}img.onload=draw;requestAnimationFrame(tick);</script></html>
